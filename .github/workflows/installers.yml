name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish (leave blank to build artifacts only)
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxkbcommon-dev libgtk-layer-shell-dev cmake clang libclang-dev
      - run: npm ci
      - run: npm run installer
        if: runner.os != 'macOS' || (inputs.release_tag || github.ref_name) != 'v0.1.5'
      - name: Build macOS installers for v0.1.5
        if: runner.os == 'macOS' && (inputs.release_tag || github.ref_name) == 'v0.1.5'
        # The existing tag predates the deployment target fix in tauri.conf.json.
        run: npm run installer -- --config '{"bundle":{"macOS":{"minimumSystemVersion":"11.0"}}}'
      - uses: actions/upload-artifact@v6
        with:
          name: vtype-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: vtype-*
          path: installers
      - name: Publish installers to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find installers -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' \) -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No installers were downloaded."
            exit 1
          fi
          if existing_assets=$(gh release view --json assets --jq '.assets[].name' -- "$RELEASE_TAG"); then
            for asset in "${assets[@]}"; do
              if ! grep -Fxq -- "${asset##*/}" <<< "$existing_assets"; then
                gh release upload -- "$RELEASE_TAG" "$asset"
              fi
            done
          else
            gh release create --verify-tag --generate-notes --title "$RELEASE_TAG" -- "$RELEASE_TAG" "${assets[@]}"
          fi
